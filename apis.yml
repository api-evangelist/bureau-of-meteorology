aid: bureau-of-meteorology

name: Bureau of Meteorology

description: The Bureau of Meteorology (BOM) is Australia's national weather, climate and water agency. It provides forecasts, severe weather
  warnings, observations, flood information, marine and high seas forecasts and climate information, and offers data products for weather, climate,
  atmosphere, oceans, water and space weather through free services and paid subscription services, including registered-user real-time data feeds
  (forecast grids, satellite, radar and a geospatial service), climate data services and water data.

