apis:
- name: Space Weather API
  description: The Space Weather API provides access to near real-time Australian Space Weather Forecasting Centre data from the Australian Bureau
    of Meteorology (A index, K index, Dst index, magnetic alerts and warnings, aurora alerts, watches and outlooks). Requests are HTTP POSTs with
    a JSON body carrying an API key obtained by registration.
  humanURL: https://sws-data.sws.bom.gov.au/api-docs
  baseURL: https://sws-data.sws.bom.gov.au/api/v1
  tags:
  - Space Weather
  - Aurora
  - Geomagnetic
  properties:
  - type: Documentation
    url: https://sws-data.sws.bom.gov.au/api-docs
  - type: Documentation
    url: https://sws.bom.gov.au/Products_and_Services/4/3
    name: Space Weather API (ASWFC)
  aid: bureau-of-meteorology:space-weather-api
- name: Water Data Online SOS2
  description: OGC Sensor Observation Service 2.0 (KISTERS KiWIS SOS2) behind the Bureau's Water Data Online, serving time series from water measurement
    stations across Australia (watercourse level and discharge, storage level and volume, rainfall, surface water quality). Operations advertised
    by GetCapabilities are GetCapabilities, DescribeSensor, GetObservation, GetFeatureOfInterest and GetDataAvailability.
  humanURL: https://www.bom.gov.au/waterdata/
  baseURL: https://www.bom.gov.au/waterdata/services
  tags:
  - Water
  - OGC
  - SOS
  properties:
  - type: GetCapabilities
    url: openapi/bureau-of-meteorology-water-data-online-sos2-capabilities.xml
    name: SOS 2.0 GetCapabilities (captured 2026-10-22)
  - type: SOS
    url: https://www.bom.gov.au/waterdata/services?service=SOS&version=2.0&request=GetCapabilities
  - type: Documentation
    url: https://www.bom.gov.au/waterdata/
  aid: bureau-of-meteorology:water-data-online-sos2

